      type: object
      properties:
        totalSessions:
          type: integer
          minimum: 0
        runningSessionCount:
          type: integer
          minimum: 0
        waitingReviewSessionCount:
          type: integer
          minimum: 0
        completedSessionCount:
          type: integer
          minimum: 0
        failedSessionCount:
          type: integer
          minimum: 0
        totalSourceRecords:
          type: integer
          format: int64
          minimum: 0
        masterRecordCount:
          type: integer
          format: int64
          minimum: 0
        pendingGroupCount:
          type: integer
          format: int64
          minimum: 0
        approvedGroupCount:
          type: integer
          format: int64
          minimum: 0
        rejectedGroupCount:
          type: integer
          format: int64
          minimum: 0
        runningJobCount:
          type: integer
          format: int64
          minimum: 0
        failedJobCount:
          type: integer
          format: int64
          minimum: 0
        readyExportCount:
          type: integer
          format: int64
          minimum: 0
