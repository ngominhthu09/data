          - COMPLETED
          - FAILED
          - REVALIDATING
        fileCount:
          type: integer
          minimum: 0
        totalRecords:
          type: integer
          format: int64
          minimum: 0
        validRecords:
          type: integer
          format: int64
          minimum: 0
        errorRecords:
          type: integer
          format: int64
          minimum: 0
        pendingGroupCount:
          type: integer
          minimum: 0
        masterRecordCount:
          type: integer
          minimum: 0
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        startedAt:
