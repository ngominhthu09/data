      - totalSessions
      - totalSourceRecords
      - masterRecordCount
      - pendingGroupCount
    CleanExport:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - GENERATING
          - READY
          - FAILED
        filename:
          type: string
        snapshotAt:
          type: string
          format: date-time
        rowCount:
          type: integer
          format: int64
          minimum: 0
        excludedCount:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
