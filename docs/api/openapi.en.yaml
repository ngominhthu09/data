openapi: 3.0.3
info:
  title: Unira API
  version: 0.2.0
  description: 'PoC: A Steward creates independent processing sessions and uploads 1..N CSV files to each session; AI matching,
    human review, and a separate clean CSV export per session. No CRM/ERP integration.'
servers:
- url: http://localhost:8000
  description: PoC environment
tags:
- name: Auth
- name: Sessions
- name: Imports
- name: Matching
- name: Review
- name: Master Data
- name: Exports
- name: Reporting
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: 'Role: Public.'
      tags:
      - Auth
      operationId: post_auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /api/v1/me:
    get:
      summary: Current user session
      description: 'Role: STEWARD/VIEWER.'
      tags:
      - Auth
      operationId: get_me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions:
    get:
      summary: List processing sessions
      description: STEWARD/VIEWER. Search and filter authorized sessions without mixing their files or results.
      tags:
      - Sessions
      operationId: list_sessions
      parameters:
      - name: query
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      summary: Create a processing session
      description: STEWARD. Create a DRAFT session with its own ID; each session accepts one or more files before AI runs.
      tags:
      - Sessions
      operationId: create_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: New session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/{sessionId}:
    get:
      summary: Get session details
      description: STEWARD/VIEWER. Return one session's progress, file count, record count, and CSV export status.
      tags:
      - Sessions
      operationId: get_session
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/{sessionId}/imports:
    post:
      summary: Upload one CSV file to a session
      description: STEWARD. Each request uploads one CSV file; multiple files may be uploaded while the session is DRAFT/READY.
        Reject non-CSV files with 400. Each file belongs to exactly one session. No CRM/ERP integration.
      tags:
      - Imports
      operationId: post_imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Input CSV file; other formats are not accepted.
                sourceLabel:
                  type: string
                  maxLength: 160
                  description: Optional origin label entered by the Steward (for example, CRM or Sales); not a source connection.
            encoding:
              file:
                contentType: text/csv
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List files in a session
      description: STEWARD. Return files from the requested session with valid/error row counts and import status.
      tags:
      - Imports
      operationId: get_imports
      responses:
        '200':
          description: Uploaded file list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/sessions/{sessionId}/imports/{batchId}:
    get:
      summary: Get details of a file in a session
      description: STEWARD. Check that batchId belongs to sessionId before returning data.
      tags:
      - Imports
      operationId: get_imports_batchId
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/{sessionId}/match-jobs:
    post:
      summary: Start AI matching for a session
      description: STEWARD. Freeze all session files as a snapshot; run blocking, Splink, and asynchronous group validation.
        Do not compare against other sessions.
      tags:
      - Matching
      operationId: post_match_jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMatchRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Session AI run history
      description: STEWARD. List only jobs belonging to the requested session.
      tags:
      - Matching
      operationId: get_match_jobs
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/match-jobs/{jobId}:
    get:
      summary: Matching job details
      description: STEWARD. Read one job's results; the response includes sessionId so the frontend can scope it correctly.
      tags:
      - Matching
      operationId: get_match_jobs_jobId
      parameters:
      - name: jobId
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/match-groups:
    get:
      summary: List likely duplicate proposals
      description: STEWARD. Return likely duplicate groups from the specified session only.
      tags:
      - Review
      operationId: get_match_groups
      parameters:
      - name: sessionId
        in: query
        required: true
        description: Strictly filter by session
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchGroupSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/match-groups/{groupId}:
    get:
      summary: Likely duplicate group details and evidence
      description: 'Role: STEWARD.'
      tags:
      - Review
      operationId: get_match_groups_groupId
      parameters:
      - name: groupId
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchGroupDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/match-groups/{groupId}/decisions:
    post:
      summary: Approve or reject a merge
      description: 'APPROVE creates a human-reviewed merge job; REJECT creates no link. Return 409 if the group version changed.


        Role: STEWARD.'
      tags:
      - Review
      operationId: post_match_groups_groupId_decisions
      parameters:
      - name: groupId
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-records:
    get:
      summary: Search Golden Records
      description: STEWARD/VIEWER. Every Golden Record belongs to one session; searches must not mix sessions.
      tags:
      - Master Data
      operationId: get_master_records
      parameters:
      - name: sessionId
        in: query
        required: true
        description: 'Required: search within a session'
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterRecordSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-records/{masterId}:
    get:
      summary: Golden Record details
      description: 'Role: STEWARD/VIEWER.'
      tags:
      - Master Data
      operationId: get_master_records_masterId
      parameters:
      - name: masterId
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterRecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-records/{masterId}/undo:
    post:
      summary: Split mistakenly merged records
      description: STEWARD. Revoke incorrect links and rebuild records from original data; mark the CSV unavailable and regenerate it.
        No version comparison.
      tags:
      - Master Data
      operationId: post_master_records_masterId_undo
      parameters:
      - name: masterId
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/{sessionId}/exports:
    get:
      summary: Get a session's clean CSV
      description: STEWARD. Each session has at most one current CSV; export versions are neither stored nor compared.
      tags:
      - Exports
      operationId: list_session_exports
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current CSV information for the session (list of at most one item).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CleanExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/{sessionId}/exports/{exportId}/download:
    get:
      summary: Download a session's clean CSV
      description: STEWARD. Download only the current READY export when the session is COMPLETED; do not rerun the job. Check
        that exportId belongs to sessionId.
      tags:
      - Exports
      operationId: download_session_export
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: exportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '302':
          description: Redirect to a time-limited download URL
          headers:
            Location:
              description: Signed download URL
              schema:
                type: string
                format: uri
        '404':
          description: File not found in this session
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/dashboard:
    get:
      summary: System overview
      description: STEWARD/VIEWER. Return session counts and overall or session-specific statistics, depending on sessionId.
      tags:
      - Reporting
      operationId: get_dashboard
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: sessionId
        in: query
        required: false
        description: 'Omit for overall metrics; supply for session-specific metrics'
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State or version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - tokenType
      - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - STEWARD
          - VIEWER
      required:
      - id
      - email
      - role
    ImportBatch:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
        rowCount:
          type: integer
          format: int64
          minimum: 0
        validCount:
          type: integer
          format: int64
          minimum: 0
        errorCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        sourceLabel:
          type: string
          description: Origin label of the file, if entered by the Steward.
      required:
      - id
      - sessionId
      - status
    StartMatchRequest:
      type: object
      properties: {}
      description: Match all confirmed files belonging to the URL's sessionId. Cross-session INCREMENTAL mode is unsupported.
    JobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
        message:
          type: string
      required:
      - jobId
      - status
    MatchJob:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - WAITING_REVIEW
          - MERGING
          - EXPORTING
          - COMPLETED
          - FAILED
        processedRecords:
          type: integer
          format: int64
          minimum: 0
        totalRecords:
          type: integer
          format: int64
          minimum: 0
        candidateCount:
          type: integer
          format: int64
          minimum: 0
        groupCount:
          type: integer
          format: int64
          minimum: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
        cleanExportId:
          type: string
          format: uuid
          description: Present when the session's final CSV is ready.
      required:
      - id
      - sessionId
      - status
    SourceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        normalizedData:
          type: object
          additionalProperties: true
        importBatchId:
          type: string
          format: uuid
        rowNumber:
          type: integer
          format: int64
        externalRecordId:
          type: string
          description: Optional identifier from the file; it may be absent or differ across files.
      required:
      - id
      - importBatchId
      - rowNumber
    MatchEvidence:
      type: object
      properties:
        field:
          type: string
        recordAValue:
          type: string
        recordBValue:
          type: string
        comparison:
          type: string
        weight:
          type: number
        conflict:
          type: boolean
      required:
      - field
      - comparison
    MatchGroupSummary:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        memberCount:
          type: integer
          format: int64
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - NEEDS_REVIEW
      required:
      - id
      - sessionId
      - jobId
      - status
    MatchedPair:
      type: object
      properties:
        recordAId:
          type: string
          format: uuid
        recordBId:
          type: string
          format: uuid
        probability:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/MatchEvidence'
      required:
      - recordAId
      - recordBId
      - probability
    MatchGroupDetail:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/MatchGroupSummary'
        members:
          type: array
          items:
            $ref: '#/components/schemas/SourceRecord'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/MatchedPair'
        warnings:
          type: array
          items:
            type: string
      required:
      - group
      - members
      - pairs
    FieldChoice:
      type: object
      properties:
        value:
          type: string
        recordId:
          type: string
          format: uuid
          description: Internal UUID of a data row in the uploaded file.
      required:
      - value
      - recordId
    ReviewRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        recordIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 2
        chosenFields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldChoice'
        reason:
          type: string
      required:
      - action
    ReviewResult:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - APPROVED
          - REJECTED
        mergeJobId:
          type: string
          format: uuid
        mergeStatus:
          type: string
          enum:
          - NONE
          - QUEUED
          - COMPLETED
          - FAILED
      required:
      - decisionId
      - status
      - mergeStatus
    MasterRecordSummary:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        masterCode:
          type: string
        displayName:
          type: string
        linkedRecordCount:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - sessionId
      - masterCode
    LinkedSource:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        recordId:
          type: string
          format: uuid
        status:
          type: string
        importBatchId:
          type: string
          format: uuid
        rowNumber:
          type: integer
          format: int64
        externalRecordId:
          type: string
          description: Optional identifier from the file; it may be absent or differ across files.
      required:
      - recordId
      - status
      - importBatchId
      - rowNumber
    MasterRecordDetail:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        masterCode:
          type: string
        canonicalData:
          type: object
          additionalProperties: true
        fieldProvenance:
          type: object
          additionalProperties:
            type: string
            format: uuid
        linkedSources:
          type: array
          items:
            $ref: '#/components/schemas/LinkedSource'
          description: Original data rows from files uploaded by the Steward.
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - sessionId
      - masterCode
      - canonicalData
      - linkedSources
    UndoRequest:
      type: object
      properties:
        recordIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        reason:
          type: string
          minLength: 1
      required:
      - recordIds
      - reason
      description: Split mistakenly merged records. Use original data and current links to recalculate records; do not restore
        a versioned snapshot.
    UndoResult:
      type: object
      properties:
        masterId:
          type: string
          format: uuid
        status:
          type: string
        sessionStatus:
          type: string
      required:
      - masterId
      - status
